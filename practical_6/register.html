<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <main>
    <h1>Student Registration</h1>
    <form id="registration-form" action="register.php" method="POST">
      <label>Name <input id="name" name="name" type="text" required></label>
      <label>Email <input id="email" name="email" type="email" required></label>
      <label>Mobile <input id="mobile" name="mobile" type="tel" required></label>
      <label>Address <textarea id="address" name="address" rows="3" required></textarea></label>
      <label>Password <input id="password" name="password" type="password" required></label>
      <label>Confirm password <input id="confirm" name="confirm" type="password" required></label>
      <label>Course
        <select name="course" required>
          <option value="">Choose a course</option>
          <option>BCA</option><option>BSc</option><option>BCom</option><option>BA</option>
        </select>
      </label>
      <label>Year
        <select name="year" required>
          <option value="">Choose a year</option>
          <option>1</option><option>2</option><option>3</option><option>4</option>
        </select>
      </label>
      <fieldset>
        <legend>Gender</legend>
        <label><input type="radio" name="gender" value="female" required> Female</label>
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
      </fieldset>
      <label class="terms"><input type="checkbox" name="terms" required> I accept the terms</label>
      <button type="submit">Register</button>
    </form>
    <p>Already registered? <a href="login.html">Login</a></p>
  </main>
  <script src="register.js"></script>
</body>
</html>
