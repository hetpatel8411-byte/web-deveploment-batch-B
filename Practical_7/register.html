<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a> |
    <a href="register.html">Register</a>
  </nav>
  <main>
    <h1>Student Registration</h1>
    <form id="registration-form" action="register.php" method="POST">
      <input id="csrf-token" name="csrf_token" type="hidden" value="">
      <p id="form-status" role="status">Preparing secure form...</p>
      <label>Name <input id="name" name="name" type="text" minlength="2" maxlength="100" autocomplete="name" required></label>
      <label>Email <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required></label>
      <label>Mobile <input id="mobile" name="mobile" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" autocomplete="tel" required></label>
      <label>Address <textarea id="address" name="address" rows="3" maxlength="1000" autocomplete="street-address" required></textarea></label>
      <label>Password <input id="password" name="password" type="password" minlength="8" maxlength="4096" autocomplete="new-password" required></label>
      <label>Confirm password <input id="confirm" name="confirm" type="password" minlength="8" maxlength="4096" autocomplete="new-password" required></label>
      <label>Course
        <select name="course" required>
          <option value="">Choose a course</option>
          <option value="BCA">BCA</option><option value="BSc">BSc</option><option value="BCom">BCom</option><option value="BA">BA</option>
        </select>
      </label>
      <label>Year
        <select name="year" required>
          <option value="">Choose a year</option>
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
        </select>
      </label>
      <fieldset>
        <legend>Gender</legend>
        <label><input type="radio" name="gender" value="female" required> Female</label>
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
      </fieldset>
      <label class="terms"><input type="checkbox" name="terms" value="yes" required> I accept the terms</label>
      <button id="submit-registration" type="submit" disabled>Register</button>
    </form>
    <p>Already registered? <a href="login.html">Login</a></p>
    <p><a href="index.html">Home</a></p>
  </main>
  <script src="register.js"></script>
</body>
</html>
